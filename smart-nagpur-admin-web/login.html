<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMC Command — Administrative Login</title>
  
  <!-- Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- Supabase JS Client v2 via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #151F33 0%, #080C14 80%);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.08) 0%, transparent 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 380px;
      z-index: 2;
    }

    .auth-card {
      background-color: var(--bg-surface);
      border: 1px solid var(--border-medium);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(16px);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .auth-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #2563EB, #1D4ED8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      color: white;
      margin: 0 auto 0.85rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .auth-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .auth-subtitle {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 0.2rem;
    }

    .auth-error {
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #F87171;
      padding: 0.55rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo-badge">🏛️</div>
        <h1 class="auth-title">NMC Command</h1>
        <p class="auth-subtitle">Nagpur Municipal Corporation • Operations Portal</p>
      </div>

      <div id="login-error-alert" class="auth-error"></div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Administrative Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="officer@nagpur.gov.in" required autocomplete="email" autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width: 100%; padding: 0.6rem; font-size: 0.88rem; font-weight: 600;">
          Sign In to Command Center
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--border-subtle); padding-top: 1rem;">
        <span style="font-size: 0.7rem; color: var(--text-muted); display: block;">
          🔒 Authorized municipal personnel only • All sessions audited
        </span>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from './js/auth.js';

    // Auto-redirect if session is valid
    auth.checkSession().then(admin => {
      if (admin) {
        window.location.href = 'index.html#dashboard';
      }
    });

    const form = document.getElementById('admin-login-form');
    const submitBtn = document.getElementById('login-submit-btn');
    const errorAlert = document.getElementById('login-error-alert');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        await auth.login(email, password);
        window.location.href = 'index.html#dashboard';
      } catch (err) {
        errorAlert.textContent = '⚠️ ' + (err.message || 'Invalid credentials or inactive account.');
        errorAlert.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In to Command Center';
      }
    });
  </script>
</body>
</html>
